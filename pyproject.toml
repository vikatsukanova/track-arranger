[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "track-arranger"
version = "0.1.0"
description = "Free, rule-based arrangement plans and MIDI scaffolds for producers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Victoria Tsukanova"}]
dependencies = ["mido>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
desktop = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18",
    "librosa>=0.10.2,<0.12",
    "soundfile>=0.12",
    "numpy>=1.26",
    "numpy<2.4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numba==0.62.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite==0.45.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pyinstaller>=6",
]

[project.scripts]
track-arranger = "track_arranger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
