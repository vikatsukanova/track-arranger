[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "track-arranger"
version = "0.1.0"
description = "Free, rule-based arrangement plans and MIDI scaffolds for producers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Victoria Tsukanova"}]
dependencies = ["mido>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
track-arranger = "track_arranger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
